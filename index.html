<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Etienne | Renovation Timeline</title>
    <meta name="description" content="Gantt Timeline for the Bar Etienne renovation project.">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content">
            <h1 class="helvetica-title">Bar Etienne</h1>
            <p class="project-info">
                Address: 44 Bedford Street, West Village, NY NY | 600 SQ FT approx<br>
                Target Handoff: End of May | Final Opening: July 5th
            </p>
        </div>
        <div class="controls">
            <label class="toggle-switch" title="Toggle Dependencies">
                <input type="checkbox" id="dependencies-toggle" checked>
                <span class="slider round"></span>
            </label>
            <span class="toggle-label" style="font-size:0.8rem; margin-right:1rem;">Dependencies</span>
            <span class="legend-item"><span class="decision-icon">❗️</span> Decisions</span>
        </div>
    </header>
    <main>
        <div class="gantt-container-scroll">
            <div class="gantt-wrapper">
                <div id="gantt-timeline" class="gantt-timeline"></div>
                <div id="gantt-tasks" class="gantt-tasks"></div>
                <svg id="dependency-lines"></svg>
            </div>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
