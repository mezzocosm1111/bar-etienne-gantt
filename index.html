<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Etienne | Renovation Timeline</title>
    <meta name="description" content="Gantt Timeline for the Bar Etienne renovation project.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content">
            <h1 class="helvetica-title">Bar Etienne</h1>
            <p class="subtitle">Renovation Timeline - 600 sq ft</p>
            <p class="project-info">
                Address: 44 Bedford Street, West Village, NY NY<br>
                Target Handoff: End of May<br>
                Final Opening: July 5th
            </p>
        </div>
        <div class="controls">
            <span class="legend-item"><span class="legend-color" style="background:#ef4444;"></span> Decision
                Required</span>
            <span class="legend-item"><span class="legend-color urgency-imminent"
                    style="width:12px;height:12px;border-radius:4px;"></span> Imminent</span>
            <span class="legend-item"><span class="legend-color urgency-coming-next"
                    style="width:12px;height:12px;border-radius:4px;"></span> Next up</span>
        </div>
    </header>
    <main>
        <div class="gantt-container-scroll">
            <div class="gantt-wrapper">
                <div id="gantt-timeline" class="gantt-timeline"></div>
                <div id="gantt-tasks" class="gantt-tasks"></div>
            </div>
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
